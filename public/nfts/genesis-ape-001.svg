<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_genesis-ape-001" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#E8DFC8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#18120E" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="shadow_genesis-ape-001" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#E8DFC8"/>
  <rect width="500" height="500" fill="url(#bgGrad_genesis-ape-001)"/>

  <!-- Torso & Clothing -->
  <g id="body">
    <!-- Shoulders -->
    <path d="M80 500 C80 400 140 370 250 370 C360 370 420 400 420 500 Z" fill="#101010" stroke="#18120E" stroke-width="6" filter="url(#shadow_genesis-ape-001)"/>
    <!-- Collar / Trim -->
    <path d="M180 370 L250 440 L320 370 L280 370 L250 410 L220 370 Z" fill="#D4AF37" stroke="#18120E" stroke-width="4"/>
    <!-- Sleeves Trim -->
    <path d="M80 470 Q130 460 160 500" stroke="#D4AF37" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M420 470 Q370 460 340 500" stroke="#D4AF37" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M180 430 Q250 490 320 430" fill="none" stroke="#FFD700" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Neck -->
  <rect x="215" y="320" width="70" height="70" fill="#634730" stroke="#18120E" stroke-width="5"/>

  <!-- Ears -->
  <circle cx="120" cy="250" r="38" fill="#634730" stroke="#18120E" stroke-width="5"/>
  <circle cx="122" cy="250" r="24" fill="#D1B48C" stroke="#18120E" stroke-width="3"/>
  <circle cx="380" cy="250" r="38" fill="#634730" stroke="#18120E" stroke-width="5"/>
  <circle cx="378" cy="250" r="24" fill="#D1B48C" stroke="#18120E" stroke-width="3"/>

  <!-- Head Base -->
  <path d="M140 230 C130 140 370 140 360 230 C360 300 320 330 250 330 C180 330 140 300 140 230 Z" fill="#634730" stroke="#18120E" stroke-width="6"/>

  <!-- Muzzle / Mouth Area -->
  <ellipse cx="250" cy="290" rx="85" ry="60" fill="#D1B48C" stroke="#18120E" stroke-width="5"/>
  <path d="M235 255 Q250 250 265 255" stroke="#BA9E77" stroke-width="4" fill="none"/>
  <!-- Nostrils -->
  <ellipse cx="238" cy="265" rx="6" ry="8" fill="#4A2E1B"/>
  <ellipse cx="262" cy="265" rx="6" ry="8" fill="#4A2E1B"/>

  <!-- Mouth -->
  
        <path d="M190 325 Q250 320 300 328" stroke="#4A2E1B" stroke-width="5" fill="none"/>
        <rect x="280" y="320" width="45" height="12" rx="3" fill="#795548" stroke="#3E2723" stroke-width="2" transform="rotate(12 280 320)"/>
        <circle cx="325" cy="330" r="5" fill="#FF5722"/>
        <path d="M330 330 Q340 315 335 300 Q345 285 340 270" stroke="#AAA" stroke-width="2" fill="none" opacity="0.6"/>
        

  <!-- Eyes & Eyebrows -->
  <!-- Brow shadow -->
  <path d="M165 195 Q250 210 335 195" stroke="#302015" stroke-width="8" stroke-linecap="round" fill="none"/>
  
        <circle cx="200" cy="225" r="28" fill="none" stroke="#FFD700" stroke-width="6"/>
        <circle cx="300" cy="225" r="28" fill="none" stroke="#FFD700" stroke-width="6"/>
        <line x1="228" y1="225" x2="272" y2="225" stroke="#FFD700" stroke-width="6"/>
        <circle cx="200" cy="225" r="12" fill="#111"/>
        <circle cx="300" cy="225" r="12" fill="#111"/>
        <circle cx="204" cy="221" r="4" fill="#FFF"/>
        <circle cx="304" cy="221" r="4" fill="#FFF"/>
        

  <!-- Headwear -->
  
        <path d="M150 140 L180 80 L250 130 L320 80 L350 140 Z" fill="#FFD700" stroke="#B8860B" stroke-width="5"/>
        <circle cx="180" cy="80" r="8" fill="#E74C3C"/>
        <circle cx="250" cy="130" r="8" fill="#3498DB"/>
        <circle cx="320" cy="80" r="8" fill="#E74C3C"/>
        

  <!-- Outer frame border subtle -->
  <rect x="0" y="0" width="500" height="500" fill="none" stroke="#18120E" stroke-width="3"/>
</svg>