<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad_captain-ape-312" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#DEC8C8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#18120E" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="shadow_captain-ape-312" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#DEC8C8"/>
  <rect width="500" height="500" fill="url(#bgGrad_captain-ape-312)"/>

  <!-- Torso & Clothing -->
  <g id="body">
    <!-- Shoulders -->
    <path d="M80 500 C80 400 140 370 250 370 C360 370 420 400 420 500 Z" fill="#1C2E4A" stroke="#18120E" stroke-width="6" filter="url(#shadow_captain-ape-312)"/>
    <!-- Collar / Trim -->
    <path d="M180 370 L250 440 L320 370 L280 370 L250 410 L220 370 Z" fill="#D4AF37" stroke="#18120E" stroke-width="4"/>
    <!-- Sleeves Trim -->
    <path d="M80 470 Q130 460 160 500" stroke="#D4AF37" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M420 470 Q370 460 340 500" stroke="#D4AF37" stroke-width="12" stroke-linecap="round" fill="none"/>
    
  </g>

  <!-- Neck -->
  <rect x="215" y="320" width="70" height="70" fill="#70533C" stroke="#18120E" stroke-width="5"/>

  <!-- Ears -->
  <circle cx="120" cy="250" r="38" fill="#70533C" stroke="#18120E" stroke-width="5"/>
  <circle cx="122" cy="250" r="24" fill="#D1B48C" stroke="#18120E" stroke-width="3"/>
  <circle cx="380" cy="250" r="38" fill="#70533C" stroke="#18120E" stroke-width="5"/>
  <circle cx="378" cy="250" r="24" fill="#D1B48C" stroke="#18120E" stroke-width="3"/>

  <!-- Head Base -->
  <path d="M140 230 C130 140 370 140 360 230 C360 300 320 330 250 330 C180 330 140 300 140 230 Z" fill="#70533C" stroke="#18120E" stroke-width="6"/>

  <!-- Muzzle / Mouth Area -->
  <ellipse cx="250" cy="290" rx="85" ry="60" fill="#D1B48C" stroke="#18120E" stroke-width="5"/>
  <path d="M235 255 Q250 250 265 255" stroke="#BA9E77" stroke-width="4" fill="none"/>
  <!-- Nostrils -->
  <ellipse cx="238" cy="265" rx="6" ry="8" fill="#4A2E1B"/>
  <ellipse cx="262" cy="265" rx="6" ry="8" fill="#4A2E1B"/>

  <!-- Mouth -->
  <path d="M195 325 Q250 335 305 325" stroke="#4A2E1B" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Eyes & Eyebrows -->
  <!-- Brow shadow -->
  <path d="M165 195 Q250 210 335 195" stroke="#302015" stroke-width="8" stroke-linecap="round" fill="none"/>
  
        <path d="M165 210 Q215 205 235 220 L240 240 Q225 265 175 260 Q155 240 165 210 Z" fill="#111111" stroke="#333" stroke-width="4"/>
        <path d="M335 210 Q285 205 265 220 L260 240 Q275 265 325 260 Q345 240 335 210 Z" fill="#111111" stroke="#333" stroke-width="4"/>
        <line x1="235" y1="220" x2="265" y2="220" stroke="#111" stroke-width="6"/>
        <line x1="160" y1="220" x2="130" y2="210" stroke="#111" stroke-width="5"/>
        <line x1="340" y1="220" x2="370" y2="210" stroke="#111" stroke-width="5"/>
        <path d="M175 218 L210 248" stroke="#444" stroke-width="2"/>
        <path d="M280 218 L315 248" stroke="#444" stroke-width="2"/>
        

  <!-- Headwear -->
  
        <ellipse cx="250" cy="130" rx="120" ry="40" fill="#FFFFFF" stroke="#1C2E4A" stroke-width="5"/>
        <path d="M150 140 Q250 180 350 140 L370 160 Q250 205 130 160 Z" fill="#1C2E4A"/>
        <circle cx="250" cy="145" r="14" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
        

  <!-- Outer frame border subtle -->
  <rect x="0" y="0" width="500" height="500" fill="none" stroke="#18120E" stroke-width="3"/>
</svg>